spring:
  application:
    name: webhook-inspector
  cloud:
    aws:
      region:
        static: ${AWS_REGION}

supabase:
  jwks-uri: ${SUPABASE_JWKS_URI}

aws:
  dynamodb:
    table-name: ${DYNAMODB_TABLE_NAME}
  sqs:
    queue-url: ${SQS_QUEUE_URL}

app:
  webhook-base-url: ${APP_WEBHOOK_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
